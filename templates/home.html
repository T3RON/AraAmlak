{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آرا املاک</title>
  <link rel="stylesheet" href="{% static 'css/vazirmatn.css' %}" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', 'Tahoma', system-ui, sans-serif;
      direction: rtl;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      padding: 3rem 2rem;
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      max-width: 480px;
      width: 90%;
    }
    h1 { font-size: 2.5rem; font-weight: 700; color: #007aff; margin-bottom: .75rem; }
    p  { font-size: 1.1rem; color: #8e8e93; line-height: 1.7; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      background: #007aff;
      color: #fff;
      border-radius: 999px;
      padding: .4rem 1.2rem;
      font-size: .85rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>آرا املاک</h1>
    <p>پلتفرم مدیریت چندآژانسی برای مشاوران املاک ایران</p>
    <a href="/health/" class="badge">بررسی سلامت سیستم</a>
  </div>
</body>
</html>
