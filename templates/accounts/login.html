{% extends "base.html" %}
{% load static %}

{% block title %}ورود — آرا املاک{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
  <div class="w-full max-w-sm">
    <!-- Card -->
    <div class="bg-white dark:bg-[#2c2c2e] rounded-3xl shadow-sm border border-black/5 dark:border-white/10 p-8 space-y-6">
      <!-- Logo / Title -->
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold">آرا املاک</h1>
        <p class="text-sm text-[#8e8e93]">برای ادامه، شماره موبایل خود را وارد کنید</p>
      </div>

      <form method="post" action="{% url 'accounts:login' %}" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-1">
          <label for="phone" class="block text-sm font-medium">شماره موبایل</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            inputmode="numeric"
            placeholder="۰۹۱۲۳۴۵۶۷۸۹"
            autocomplete="tel"
            class="w-full rounded-2xl border border-black/10 dark:border-white/10 bg-[#f2f2f7] dark:bg-[#3a3a3c] px-4 py-3 text-base outline-none focus:ring-2 focus:ring-[#007aff] transition text-center ltr"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-[#007aff] hover:bg-[#0066d6] active:scale-[.98] text-white font-semibold rounded-2xl py-3 transition-all duration-150"
        >
          ارسال کد تأیید
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
